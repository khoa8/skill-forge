name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feature/production-hardening

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: typecheck, test, build, demo, provider-verify, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Demo pipeline
        run: npm run demo

      - name: Provider verification (offline)
        run: npm run verify:provider
        env:
          # Pinned to the offline mock provider so CI can never reach a paid
          # remote provider even if repository/runner variables leak in.
          SKILLFORGE_PROVIDER: mock

      - name: Dependency audit
        # Strict gate: fails on any low-severity advisory or higher
        # (current state: 0 vulnerabilities).
        run: npm audit --audit-level=low
