name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Build runs BEFORE test so the production smoke test in the suite can
      # exercise the compiled output (dist/) as a hard gate.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Demo pipeline
        run: npm run demo

      - name: Provider verification (offline)
        run: npm run verify:provider
        env:
          # Pinned to the offline mock provider so CI can never reach a paid
          # remote provider even if repository/runner variables leak in.
          SKILLFORGE_PROVIDER: mock

      - name: Dependency audit
        # Strict gate: fails on any low-severity advisory or higher.
        run: npm audit --audit-level=low

      - name: Documentation links
        # Dependency-free check: relative Markdown links/images resolve and
        # no doc references removed status documents.
        run: npm run docs:check

  production-smoke:
    name: production smoke (pruned)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality-gate
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The whole point: prove the compiled runtime needs NO devDependency
      # (tsx/TypeScript/Vitest removed) before this smoke runs.
      - name: Prune dev dependencies
        run: npm prune --omit=dev

      - name: Production smoke (plain Node)
        run: npm run smoke:production
